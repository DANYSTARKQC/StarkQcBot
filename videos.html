<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANYSTARKQC — Vidéos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="videos">

  <header>
    <div class="logo"><a href="index.html">DANY<span style="color:var(--text-primary)">STARKQC</span></a></div>
    <div class="search-bar"><input type="text" placeholder="Rechercher des vidéos..."></div>
    <nav>
      <a href="index.html">🏠 Accueil</a>
      <a href="videos.html" class="active">🎬 Vidéos</a>
      <a href="streaming.html" class="live-link"><span class="live-dot"></span> Live</a>
      <a href="photos.html">🖼️ Photos</a>
      <a href="projects.html">🚀 Projets</a>
    </nav>
    <div class="user-buttons" id="userButtons"></div>
  </header>

  <main>
    <h1 class="page-title">🎬 Vidéos</h1>
    <div id="videoContent"></div>
  </main>

  <!-- ADD VIDEO MODAL -->
  <div class="modal-overlay" id="addVideoModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Ajouter une vidéo</h2>
        <button class="modal-close" onclick="closeModal('addVideoModal')">×</button>
      </div>
      <form id="addVideoForm">
        <div>
          <label class="modal-label">Titre de la vidéo *</label>
          <input class="modal-form-input" id="vTitle" type="text" placeholder="Ex: Best moments..." required>
        </div>
        <div>
          <label class="modal-label">URL YouTube *</label>
          <input class="modal-form-input" id="vUrl" type="url" placeholder="https://youtube.com/watch?v=..." required>
        </div>
        <div>
          <label class="modal-label">Description (optionnel)</label>
          <input class="modal-form-input" id="vDesc" type="text" placeholder="Courte description...">
        </div>
        <button class="modal-submit" type="submit">Publier la vidéo</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2024 DANYSTARKQC — <a href="index.html">Accueil</a> · <a href="streaming.html">Live</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
