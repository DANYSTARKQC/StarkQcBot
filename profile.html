<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DANYSTARKQC — Mon Profil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="profile">
  <header>
    <div class="logo"><a href="index.html">DANY<span>STARKQC</span></a></div>
    <div class="search-bar"><input type="text" placeholder="Rechercher..."></div>
    <nav>
      <a href="index.html">🏠 Accueil</a>
      <a href="videos.html">🎬 Vidéos</a>
      <a href="streaming.html" class="live-link"><span class="live-dot"></span> Live</a>
      <a href="photos.html">🖼️ Photos</a>
      <a href="projects.html">🚀 Projets</a>
    </nav>
    <div class="user-buttons" id="userButtons"></div>
  </header>

  <main style="padding-top:0;padding-left:0;padding-right:0;max-width:none;">
    <div id="profileContent"></div>
    <div style="padding:28px 22px;max-width:1360px;margin:0 auto;">
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;">
        <a href="videos.html" style="background:var(--bg-secondary);border:1.5px solid var(--border);border-radius:var(--r-md);padding:18px;display:flex;align-items:center;gap:12px;transition:border-color 0.2s,transform 0.2s;" onmouseover="this.style.borderColor='var(--accent)';this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='var(--border)';this.style.transform=''">
          <span style="font-size:22px;">🎬</span><div><div style="font-weight:700;font-size:13px;">Mes vidéos</div><div style="color:var(--text-secondary);font-size:12px;margin-top:2px;">Gérer les vidéos</div></div>
        </a>
        <a href="photos.html" style="background:var(--bg-secondary);border:1.5px solid var(--border);border-radius:var(--r-md);padding:18px;display:flex;align-items:center;gap:12px;transition:border-color 0.2s,transform 0.2s;" onmouseover="this.style.borderColor='var(--accent)';this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='var(--border)';this.style.transform=''">
          <span style="font-size:22px;">🖼️</span><div><div style="font-weight:700;font-size:13px;">Mes photos</div><div style="color:var(--text-secondary);font-size:12px;margin-top:2px;">Gérer les photos</div></div>
        </a>
        <a href="projects.html" style="background:var(--bg-secondary);border:1.5px solid var(--border);border-radius:var(--r-md);padding:18px;display:flex;align-items:center;gap:12px;transition:border-color 0.2s,transform 0.2s;" onmouseover="this.style.borderColor='var(--accent-purple)';this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='var(--border)';this.style.transform=''">
          <span style="font-size:22px;">🚀</span><div><div style="font-weight:700;font-size:13px;">Mes projets</div><div style="color:var(--text-secondary);font-size:12px;margin-top:2px;">Gérer les projets</div></div>
        </a>
        <a href="streaming.html" style="background:var(--bg-secondary);border:1.5px solid var(--border);border-radius:var(--r-md);padding:18px;display:flex;align-items:center;gap:12px;transition:border-color 0.2s,transform 0.2s;" onmouseover="this.style.borderColor='#eb0400';this.style.transform='translateY(-2px)'" onmouseout="this.style.borderColor='var(--border)';this.style.transform=''">
          <span style="font-size:22px;">📡</span><div><div style="font-weight:700;font-size:13px;">Live Stream</div><div style="color:var(--text-secondary);font-size:12px;margin-top:2px;">Aller au stream</div></div>
        </a>
      </div>
    </div>
  </main>

  <footer><p>&copy; 2024 DANYSTARKQC — <a href="index.html">Accueil</a></p></footer>
  <script src="script.js"></script>
</body>
</html>
